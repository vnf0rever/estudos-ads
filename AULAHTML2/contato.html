<!-- Início do código -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Indicações de Jogos (XBOX)</title></head>
    <link rel="stylesheet" href="style.css">
<body>




    <!-- Cabeçalho Principal -->
    <header>
        <h1>Fale Conosco - Indicações de Jogos (XBOX)</h1>




        <!-- Menu de Navegação -->
        <nav>
            <a href="index.html">Página Principal</a> |
            <a href="cadastro.html">Cadastro</a> |
            <a href="contato.html">Contato</a> |
            <a href="sobre.html">Sobre</a> 
        </nav>
    </header>




        <!-- Conteúdo Principal -->
        <main>
            <h2>Formulário para Contato</h2>




            <!-- Início do Formulário de Mensagem -->
            <form action="#" method="post">
            
                <p>
                    <!-- Campo: Nome -->
                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome"> 
                </p>

                <p>
                    <!-- Campo: E-mail -->
                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="seu@email.com">
                </p>

                <p>
                    <!-- Campo: Assunto -->
                    <label for="assunto">Assunto:</label><br>
                    <input type="text" id="assunto" name="assunto" placeholder="Digite o assunto">
                </p>

                <p>
                    <!-- Área para Mensagem Longa -->
                    <label for="mensagem">Mensagem:</label><br>
                    <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem aqui..."></textarea>
                </p>

                <p>
                    <!-- Botão de Envio -->
                    <button type="submit">Enviar formulário</button>
                </p>
            </form>
            <!-- Fim do Formulário -->
        </main>




        <!-- Rodapé -->
        <footer>
            <p>&copy; 2026 - Todos os direitos Reservados.</p>
        </footer>




</body>
</html>
